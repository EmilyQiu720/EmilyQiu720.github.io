    <text x="694" y="748" font-size="15" fill="#334155">REQ-100407</text><text x="842" y="748" font-size="15" fill="#334155">0.57</text><text x="930" y="748" font-size="15" fill="#b45309">Manual Review</text><text x="1072" y="748" font-size="15" fill="#334155">82 ms</text>
    <text x="694" y="792" font-size="15" fill="#334155">REQ-100512</text><text x="842" y="792" font-size="15" fill="#334155">0.12</text><text x="930" y="792" font-size="15" fill="#0f766e">Approve</text><text x="1072" y="792" font-size="15" fill="#334155">74 ms</text>

